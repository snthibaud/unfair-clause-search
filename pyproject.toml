[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[project]
name = "tos-fairness-analyzer"
version = "0.1.0"
description = "Semantic search and unfair-clause detection for Terms of Service"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "transformers>=4.40.0",
    "scikit-learn>=1.3.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.0.0",
    "faiss-cpu>=1.8.0",
    "numpy>=1.24.0",
    "tqdm>=4.66.0",
    "streamlit>=1.28.0",
    "requests>=2.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "hypothesis>=6.100.0",
    "httpx2>=0.1.0",
]

[dependency-groups]
dev = [
    "aifingerprint>=1.6.0",
    "gptzero>=0.1.2",
    "radon>=6.0.1",
    "ruff>=0.16.1",
]
